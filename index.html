<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Спільнота</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2345688E'/><text y='.9em' font-size='80' fill='white' font-family='sans-serif'>С</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Шапка ВК 2013 -->
<div class="header">
  <div class="header-inner">
    <a class="logo" href="#/">спільнота</a>
    <div class="header-user" id="header-user"></div>
  </div>
</div>

<div class="page">
  <!-- Ліве меню -->
  <div class="sidebar" id="sidebar">
    <ul class="menu">
      <li><a href="#/" data-nav="news"><span class="mi">🏠</span> Моя сторінка</a></li>
      <li><a href="#/feed" data-nav="feed"><span class="mi">📰</span> Стрічка</a></li>
      <li><a href="#/messages" data-nav="messages"><span class="mi">💬</span> Повідомлення<span class="counter" id="msg-counter"></span></a></li>
      <li><a href="#/people" data-nav="people"><span class="mi">👥</span> Люди</a></li>
    </ul>
    <div class="menu-foot" id="menu-foot"></div>
  </div>

  <!-- Контент -->
  <div class="content" id="content"></div>
</div>

<!-- Мобільна нижня навігація -->
<div class="bottom-nav">
  <a href="#/" data-nav="news">🏠<br><small>Сторінка</small></a>
  <a href="#/feed" data-nav="feed">📰<br><small>Стрічка</small></a>
  <a href="#/messages" data-nav="messages">💬<br><small>Чати</small></a>
  <a href="#/people" data-nav="people">👥<br><small>Люди</small></a>
</div>

<!-- Модалка реєстрації -->
<div class="modal-mask hidden" id="reg-mask">
  <div class="modal">
    <div class="modal-title">Ласкаво просимо до Спільноти!</div>
    <div class="modal-sub">Оберіть собі ім'я та аватар</div>
    <input class="input" id="reg-name" maxlength="24" placeholder="Ваше ім'я або нік">
    <div class="emoji-grid" id="reg-emojis"></div>
    <div class="btn-row">
      <button class="btn" id="reg-btn">Увійти</button>
    </div>
    <div class="err" id="reg-err"></div>
  </div>
</div>

<!-- Тоаст -->
<div class="toast hidden" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
