<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Спільнота</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2345688E'/><text y='.9em' font-size='80' fill='white' font-family='sans-serif'>С</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Шапка ВК 2013 -->
<div class="header">
  <div class="header-inner">
    <a class="logo" href="#/">спільнота</a>
    <div class="header-user" id="header-user"></div>
  </div>
</div>

<div class="page">
  <!-- Ліве меню (генерується з модулів) -->
  <div class="sidebar" id="sidebar">
    <ul class="menu"></ul>
    <div class="menu-foot" id="menu-foot"></div>
  </div>

  <!-- Контент -->
  <div class="content" id="content"></div>
</div>

<!-- Мобільна нижня навігація (генерується з модулів) -->
<div class="bottom-nav" id="bottom-nav"></div>

<!-- Модалка входу (особистий GitHub-токен) -->
<div class="modal-mask hidden" id="reg-mask">
  <div class="modal">
    <div class="modal-title" id="reg-title">Вхід у Спільноту</div>
    <div class="modal-sub" id="reg-sub"></div>

    <!-- Крок 1: токен -->
    <div id="reg-step1">
      <input class="input" id="token-input" placeholder="Вставте GitHub-токен (ghp_... або github_pat_...)" autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
      <div class="btn-row">
        <button class="btn" id="reg-btn" onclick="tryLogin()">Увійти</button>
      </div>
      <div class="err" id="reg-err"></div>
    </div>

    <!-- Крок 2: вибір аватара -->
    <div id="reg-step2" class="hidden">
      <div class="modal-sub">Майже готово! Оберіть аватар</div>
      <div class="emoji-grid" id="reg-emojis"></div>
      <div class="btn-row">
        <button class="btn" id="finish-btn" onclick="finishRegistration()">Увійти</button>
      </div>
      <div class="err" id="reg-err2"></div>
    </div>
  </div>
</div>

<!-- Тоаст -->
<div class="toast hidden" id="toast"></div>

<script src="js/app.js?v=5"></script>
</body>
</html>
